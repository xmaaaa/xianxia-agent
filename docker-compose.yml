services:
  postgres:
    image: postgres:16-alpine
    container_name: xianxia-postgres
    environment:
      POSTGRES_USER: xianxia
      POSTGRES_PASSWORD: xianxia
      POSTGRES_DB: xianxia_db
    ports:
      - "5432:5432"
    volumes:
      - xianxia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xianxia -d xianxia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xianxia-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - xianxia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  xianxia_pg_data:
  xianxia_redis_data:
