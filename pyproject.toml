[project]
name = "xianxia-agent"
version = "0.2.0"
description = "AI-powered Xianxia (cultivation fantasy) RPG agent — LangGraph + RAG + FastAPI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
